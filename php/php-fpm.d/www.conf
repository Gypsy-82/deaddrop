; PHP-FPM pool — single pool, non-root, TCP on :9000, logs to stderr.
; This file replaces the image's default www.conf.

[global]
; Run in the foreground as PID 1 (Docker handles supervision); no pid file to write.
daemonize = no
; Send the master's errors to stderr → captured by `docker compose logs`.
error_log = /proc/self/fd/2

[www]
; user/group are intentionally OMITTED: the container already runs as uid/gid 82
; (www-data) via the image's USER and compose `user:`. A non-root master can't setuid,
; so specifying them would only warn — workers simply inherit the current (non-root) user.

; Listen on TCP so Caddy (a separate container) can reach us over the internal network.
listen = 9000

; Process manager.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Built-in ping endpoint used by the container healthcheck (cgi-fcgi → /ping → "pong").
ping.path = /ping
ping.response = pong

; Surface worker stdout/stderr (e.g. error_log output) in the container logs.
catch_workers_output = yes
decorate_workers_output = no

; Only expose these superglobals' vars we actually pass; keep the app's env clean.
clear_env = no
