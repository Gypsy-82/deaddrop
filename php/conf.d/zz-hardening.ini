; PHP hardening — applied to both FPM and CLI SAPIs.

; Don't advertise PHP.
expose_php = Off

; Explicit timezone so date() never warns about relying on the system default.
date.timezone = UTC

; Never leak errors to clients; log them to stderr (captured by `docker compose logs`).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; error_log is intentionally unset here so errors flow to the php-fpm error log
; (configured to stderr in php-fpm.d/www.conf), avoiding any file write under the
; read-only root filesystem.

; Keep all scratch writes on the tmpfs.
sys_temp_dir = "/tmp"
upload_tmp_dir = "/tmp"
session.save_path = "/tmp"

; Resource / request limits.
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 8M
max_execution_time = 15
max_input_time = 15
max_input_vars = 200

; Confine filesystem access to code, data, and scratch only.
open_basedir = "/var/www/html:/data:/tmp"

; No remote file access from PHP (the container has no egress anyway).
allow_url_fopen = Off
allow_url_include = Off

; Disable command-execution and process functions.
disable_functions = "exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,proc_nice,proc_terminate"

; Opcache (in-memory only — safe under read-only rootfs).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
; Bind-mounted code can change on the host; revalidate so edits show up.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Cookie / session hardening (used only if the app ever sets a session).
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
